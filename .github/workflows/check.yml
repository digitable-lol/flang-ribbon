#
# Проверки flang-ribbon на каждый толчок.
#
# Компилятор flang — один двоичный файл, которому нужен только `cc`, поэтому он
# собирается прямо здесь из своего же клона: ни Node, ни Python в этом конвейере
# нет ни в одном шаге. Go ставится ТОЛЬКО ради напечатанного кода (`gofmt`,
# `go vet`, `go build` над `out-go/`, плюс ветка Go в сверке) — рукописного Go в
# дереве нет ни строкой, и отдельный шаг это проверяет.
#
# КАЖДЫЙ ШАГ — ЯРЛЫК, а не своя строка. Проверка, которую нельзя повторить у
# себя одной командой, проверкой не считается.
#
# НИ ОДНОГО КОНВЕЙЕРА ЧЕРЕЗ `|` НАД ПРОВЕРЯЮЩЕЙ КОМАНДОЙ. Оболочка шагов —
# `bash -e` без `pipefail`, поэтому `flang check --proof "$m" | tail -8` отдаёт
# код `tail`, то есть всегда ноль: так шаг «Ведомость доказательств» в двух
# соседних репозиториях полгода не мог покраснеть. Ярлык `ведомость` печатает
# целиком и отдаёт свой код. Ловушка воспроизводится вживую ярлыком `наоборот`.
name: Проверки

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — проверка, ведомость, печать, сверка с эталоном и с живой лентой
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Компилятор flang
        run: |
          git clone --depth 1 https://github.com/digitable-lol/flang.git /tmp/flang-src
          make -C /tmp/flang-src/bootstrap -j4
          echo "/tmp/flang-src/bootstrap" >> "$GITHUB_PATH"

      - name: Список ярлыков читается двоичным
        run: ./ярлык

      - name: Разбор, типы, завершаемость, примеры
        run: ./ярлык проверка

      - name: Ведомость доказательств — печатается, а не подразумевается
        run: ./ярлык ведомость

      - name: Печать в Go и в C, сборка обеих
        run: ./ярлык печать

      - name: Лицензионный сторож
        run: ./ярлык лицензии

      # Сторож читает файлы по списку `git ls-files`, а нечитаемое пропускает
      # молча — и кириллические имена, пришедшие экранированными, выпадали
      # из-под него. Здесь считается, что прочитано РОВНО столько файлов,
      # сколько в дереве.
      - name: Сторож посмотрел на каждый файл, а не пропустил молча
        run: |
          ./ярлык лицензии > "$RUNNER_TEMP/guard.json"
          listed=$(git ls-files | wc -l)
          read_n=$(grep -o '"Прочитать файл"' "$RUNNER_TEMP/guard.json" | wc -l)
          echo "в дереве $listed, прочитано $read_n"
          test "$listed" = "$read_n" || { echo "сторож пропустил файлы" >&2; exit 1; }

      # Второй способ, нарочно тупой и не зависящий от flang: сам сторож — тоже
      # программа, и ошибиться он может.
      - name: В дереве нет Go, питона, JavaScript и рукописного C
        run: |
          bad=$(git ls-files | grep -E '\.(go|py|pyi|js|mjs|cjs|ts|tsx|jsx|c|h)$' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "файл на чужом языке" >&2; exit 1; fi
          echo "чужого языка в дереве нет"

      # Живой оконный менеджер: он нужен и сверке лент, и восьмому
      # отрицательному контролю. Собирается из клона digitwm - тремя
      # библиотеками X и yacc, - а арифметику ленты он берёт из СВОЕГО
      # подмодуля, на своём отпечатке: эталон обязан оставаться эталоном.
      - name: Оконный менеджер digitwm — для сверки лент
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxft-dev libxrandr-dev bison
          git clone --recursive --depth 1 https://github.com/digitable-lol/digitwm.git /tmp/digitwm
          make -C /tmp/digitwm/ribbon-flang emit
          make -C /tmp/digitwm
          echo "DIGITWM=/tmp/digitwm" >> "$GITHUB_ENV"

      - name: Оба обещания ленты на 896 лентах
        run: ./ярлык сетка

      - name: Лента до вставки и после — против живого cwm, побайтно
        run: ./ярлык вставка

      - name: Отрицательный контроль — каждую проверку ломают и требуют красного
        run: ./ярлык наоборот

      # Главная проверка этого репозитория: перенос совпадает с эталоном на
      # полумиллионе входов, побайтно, и в C, и в Go. Требует сети — клонирует
      # digitwm на пришпиленном коммите.
      - name: Сверка с эталоном digitwm — 526 871 вход, побайтно
        run: ./ярлык сверка

      - name: Ярлыка с опечаткой нет — оболочка отвечает кодом 2
        run: |
          set +e
          ./ярлык такого-ярлыка-нет >/dev/null 2>&1
          code=$?
          set -e
          test "$code" = "2" || { echo "ждали код 2, получили $code" >&2; exit 1; }
          echo "неизвестный ярлык отвергается кодом 2"

      - name: Дерево чистое
        run: |
          ./ярлык чисто
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Проверки наследили в дереве." >&2
            exit 1
          fi
